<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Le dot de marque (wordmark, CTA, titres) devient LE mark du favicon :
       vectoriel, net à 16 px, aucune dépendance à une police système. -->
  <defs>
    <linearGradient id="g" x1="18" y1="18" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC178"/>
      <stop offset="0.55" stop-color="#FF6F61"/>
      <stop offset="1" stop-color="#F0476B"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.35" stop-color="#FF9A4D" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF9A4D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#02030A"/>
  <circle cx="32" cy="32" r="23" fill="url(#halo)"/>
  <circle cx="32" cy="32" r="13.5" fill="url(#g)"/>
</svg>
